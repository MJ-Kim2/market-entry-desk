<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Entry Desk · MG2644</title>
<style>
:root{
  --ink:#14213d; --muted:#5b6478; --line:#d9dee8; --bg:#f5f7fb; --card:#ffffff;
  --brand:#0b2545; --accent:#13657a; --accent-soft:#e3f1f4;
  --red:#b42318; --red-soft:#fde7e5; --amber:#8a5a00; --amber-soft:#fff3d6;
  --green:#1d6b3a; --green-soft:#e2f4e8; --lock:#8b93a5;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
header{background:var(--brand);color:#fff;padding:14px 20px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
header .title{font-weight:700;font-size:1.1rem;letter-spacing:.2px}
header .code{opacity:.8;font-size:.85rem}
nav.steps{max-width:1000px;margin:10px auto 0;display:flex;gap:6px;flex-wrap:wrap}
nav.steps span{font-size:.75rem;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#dfe7f5}
nav.steps span.on{background:#fff;color:var(--brand);font-weight:700}
nav.steps span.done{background:rgba(255,255,255,.28);color:#fff}
nav.steps span.locked{opacity:.55}
main{max-width:1000px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:2rem;margin:.2em 0 .3em;line-height:1.2}
h2{font-size:1.45rem;margin:1.2em 0 .5em;line-height:1.25}
h3{font-size:1.1rem;margin:1em 0 .4em}
p{margin:.5em 0}
.lead{font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.event{border-left:6px solid var(--red);background:#fff}
.event .tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.real{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.warn{background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.small{font-size:.85rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button,.btn{font:inherit;font-size:1rem;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
button.quiet{background:#eef1f6;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid #f2b705;outline-offset:2px}
label{font-weight:600}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:9px;background:#fff;width:100%}
input.num{max-width:170px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr} html{font-size:17px}}
.field{margin:10px 0}
.field .help{font-weight:400;font-size:.85rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
td.r,th.r{text-align:right}
.cell{display:inline-block;background:#eef1f6;border-radius:6px;padding:1px 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;font-weight:700}
.yellow{background:#fff6cc}.green{background:#e2f4e8}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.hint{font-size:.85rem;color:var(--red)}
.opt{display:block;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;font-weight:400;background:#fff}
.opt input{margin-right:10px;transform:scale(1.2)}
.opt b{font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .desc{display:block;margin-left:28px;font-size:.92rem;color:var(--muted)}
tr.mine{background:var(--accent-soft);font-weight:700}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.meters{grid-template-columns:1fr 1fr}}
.meter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.meter .lab{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.meter .val{font-size:1.6rem;font-weight:800}
.debrief{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:6px 18px 12px;margin:16px 0}
.debrief dt{font-weight:800;color:var(--accent);margin-top:10px;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}
.debrief dd{margin:2px 0 4px 0}
blockquote{margin:6px 0;padding:6px 12px;border-left:4px solid var(--line);color:#333;background:#fafbfd;font-size:.95rem}
.hm td.s{text-align:center;font-weight:800;border-radius:6px}
.b-red{background:var(--red-soft);color:var(--red)}.b-amb{background:var(--amber-soft);color:var(--amber)}.b-grn{background:var(--green-soft);color:var(--green)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
.locked{color:var(--lock)}
pre.log{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.8rem;max-height:340px;overflow:auto}
footer{max-width:1000px;margin:0 auto;padding:0 18px 30px;font-size:.8rem;color:var(--muted)}
.hide{display:none}
</style>
</head>

function expect(c){ return {B23:c.B17-c.B18,B24:c.B19-c.B20,B25:c.B19-c.B17,B26:c.B20-c.B18,B28:c.B15*c.B16,
  B29:c.B15*c.B16*(1+(c.B17-c.B18)/100),B30:c.B15*c.B16*(1+(c.B19-c.B20)/100),B31:c.B15*c.B16*(1+c.B21/100)}; }
function checkCell(k,c,e){
  const v=c[k]; if(!isFinite(v)) return {ok:false,msg:'Empty. Type the number from your Excel cell.'};
  if(['B23','B24','B25','B26'].includes(k)){
    if(Math.abs(v-e[k])<=0.06) return {ok:true};
    let msg='Not right yet.';
    if(Math.abs(v+e[k])<=0.06 && Math.abs(e[k])>0.06) msg='The sign is the wrong way round. Check the order: the first cell minus the second.';
    return {ok:false,msg:msg};
  }
  if(k==='B28'){
    if(e.B28>0 && Math.abs(v/e.B28-1)<=0.01) return {ok:true};
    if(c.B16>0 && Math.abs(v-c.B15/c.B16)<=Math.max(1,0.01*c.B15/c.B16)) return {ok:false,msg:'You divided. B28 multiplies: =B15*B16.'};
    return {ok:false,msg:'Not right yet.'};
  }
  const base=(isFinite(c.B28)&&c.B28>0)?c.B28:e.B28;
  const pct=(v/base-1)*100;
  const want={B29:e.B23,B30:e.B24,B31:c.B21}[k];
  const tol=Math.max(0.06,100/base);
  if(Math.abs(pct-want)<=tol) return {ok:true};
  if(Math.abs(v-base*(1+want))<=Math.max(1,0.01*base*(1+want))) return {ok:false,msg:'Did you forget /100? The change is a percentage.'};
  return {ok:false,msg:'Not right yet.'};
}

   {id:'B',label:'PPP price + review every quarter',desc:'Start at the PPP price. Each quarter, pass on half of any currency fall.',pS:c.B23+s/2,pC:c.B23,rep:0,ctrl:0},

  readCalc(); const c=S.calc; const msg=document.getElementById('calcMsg');

  if(missing.length){ msg.innerHTML='<span class="bad">Fill the yellow cells first: '+missing.map(r=>r[0]).join(', ')+'.</span>'; return; }
  if(!(c.B15>0)||!(c.B16>0)){ msg.innerHTML='<span class="bad">B15 and B16 must be bigger than 0.</span>'; return; }
  const e=expect(c);
  RESULTS.forEach(r=>{ const k=r[0]; if(S.shown[k]){ S.ok[k]=true; return; }
    const res=checkCell(k,c,e); S.ok[k]=res.ok; S.ok['_'+k]=res.msg||''; if(!res.ok) S.tries[k]=(S.tries[k]||0)+1; });
  persist(); paintChecks();
  msg.innerHTML = allOk()? '<span class="ok">All correct. Your Excel calculator is finished. ✓</span>' : '<span class="bad">Some cells need fixing. Fix them in Excel, then type the new number here.</span>';
  document.getElementById('bNext').disabled=!allOk();
}
function paintChecks(){
  const c=S.calc, e=expect(c);
  RESULTS.forEach(r=>{ const k=r[0]; const m=document.getElementById('m'+k); if(!m) return;
    if(S.ok[k]){ m.innerHTML='<span class="ok">✓'+(S.shown[k]?' (answer shown)':'')+'</span>'; return; }
    if(S.ok[k]===false){
      let h='<span class="bad">✗</span> <span class="hint">'+esc(S.ok['_'+k])+' Type in Excel: <b>'+r[2]+'</b> ('+T(r[3])+').</span>';
      if((S.tries[k]||0)>=2) h+=' <button class="quiet" data-show="'+k+'" type="button">Show the answer</button>';
      m.innerHTML=h;
    }
  });
  app.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const k=b.dataset.show; let val=e[k];
    if(['B29','B30','B31'].includes(k)){ const base=(isFinite(c.B28)&&c.B28>0&&S.ok.B28)?c.B28:e.B28; val=base*(1+({B29:e.B23,B30:e.B24,B31:c.B21}[k])/100); }
    S.calc[k]=val; S.shown[k]=true; S.ok[k]=true; persist(); vCalc();
    document.getElementById('calcMsg').innerHTML='<span class="small">Answer shown for '+k+'. Now fix that cell in your Excel file too.</span>'; });
}

function optList(name,items,selected,locked){
  return items.map((o,i)=>`<label class="opt ${selected===String(i)?'sel':''}"><input type="radio" name="${name}" value="${i}" ${selected===String(i)?'checked':''} ${locked?'disabled':''}><b>${esc(o.id||String.fromCharCode(65+i))}. ${T(o.label||o.t)}</b>${o.desc?'<span class="desc">'+T(o.desc)+'</span>':''}</label>`).join('');
}
function radioVal(name){ const r=app.querySelector('input[name="'+name+'"]:checked'); return r?r.value:null; }
function wireOpts(){ app.querySelectorAll('.opt input').forEach(inp=>inp.addEventListener('change',()=>{ app.querySelectorAll('input[name="'+inp.name+'"]').forEach(x=>x.closest('.opt').classList.toggle('sel',x.checked)); })); }

function vR1(){
  const c=S.calc, co=S.co, st=r1Setup(), opts=r1Outcomes(); const r=S.r1||{};
  const shockText = st.peg
    ? `Your ${esc(co.hostCur)} had no big fall in 2018–2025 (your worst year: ${f(c.B21)}%). Pegged or managed currencies often look like this, until the peg breaks. <b>Egypt, 6 March 2024:</b> about 30.85 → 50 pounds per US dollar, overnight. This round uses a <b>60%</b> shock: 60% more ${esc(co.hostCur)} for 1 ${esc(co.homeCur)}.`
    : `It happens again. During 2027 it takes <b>${f(st.s)}% more ${esc(co.hostCur)}</b> to buy 1 ${esc(co.homeCur)}: the same as your worst year in 2018–2025 (cell B21).`;
  const predOpts=opts.map(o=>({id:o.id,label:o.label}));
  let h=`<h1>Round 1 · Currency shock</h1>

  ${st.peg?'<p class="small">If your host uses the US dollar itself (e.g. Ecuador, El Salvador, Panama) and your home is the USA, there is no exchange-rate risk. Play this as a "what if", and say so in your essay.</p>':''}</div>`;
  if(!r.pred){
    h+=`<h2>Step 1 · Predict</h2><p>Which choice will keep the <b>most ${esc(co.homeCur)} revenue</b> in this shock year?</p>${optList('pred',predOpts,null)}<div class="btns"><button id="bPred">Lock my prediction</button></div>`;
  } else if(!r.choice){
    h+=`<p class="small">Your prediction: ${esc(r.pred)}.</p><h2>Step 2 · Decide</h2><p>You are the pricing team. What do you do?</p>
    <p class="note">Game rule: if the local price goes up 10%, about 5% of customers stop buying.</p>${optList('ch',opts,null)}<div class="btns"><button id="bCh">Make my decision</button></div>`;
  } else {

    <div class="card"><table><thead><tr><th>Choice</th><th class="r">Shock year: revenue kept</th><th class="r">Shock year: customers kept</th><th class="r">Calm year*: revenue</th><th class="r">Calm year*: customers</th></tr></thead><tbody>
    ${opts.map(o=>`<tr class="${o.id===r.choice?'mine':''}"><td>${o.id}. ${T(o.label)}${o.id===r.choice?' ← you':''}</td><td class="r">${f(o.revS,0)}%</td><td class="r">${f(o.custS,0)}%</td><td class="r">${f(o.revC,0)}%</td><td class="r">${f(o.custC,0)}%</td></tr>`).join('')}
    </tbody></table><p class="small">* Calm year: the currency moves only as PPP says (B23). Revenue is in ${esc(co.homeCur)}, compared with today.</p>
    <p>Your prediction (${esc(r.pred)}) was ${r.pred===best.id?'<span class="ok">right</span>':'<span class="bad">not right</span>'}: ${best.id} kept the most revenue in the shock year.</p></div>
    <dl class="debrief">
      <dt>What happened</dt><dd>Your choice (${mine.id}) kept <b>${f(mine.revS,0)}%</b> of your ${esc(co.homeCur)} revenue and <b>${f(mine.custS,0)}%</b> of your customers.</dd>
      <dt>Why</dt><dd>A price fixed in ${esc(co.hostCur)} is worth less in ${esc(co.homeCur)} when the ${esc(co.hostCur)} falls. PPP (${fs(c.B23)}%) and IFE (${fs(c.B24)}%) are signals, not forecasts. The shock (${fs(st.s)}%) was ${st.s>Math.max(c.B23,c.B24)?'bigger than both':'not bigger than both'}. That is why one price is not enough.</dd>
      <dt>Theory</dt><dd>Purchasing Power Parity (PPP) · International Fisher Effect (IFE)</dd>
      <dt>Goes in your essay</dt><dd><b>Recommendations.</b> The brief says: <blockquote>${BRIEF.pricing}</blockquote> Your note needs: a range (PPP price ${money(c.B29)} to IFE price ${money(c.B30)} ${esc(co.hostCur)}), a stress test (${money(c.B31)} ${esc(co.hostCur)}), your assumptions, and a plan B. Was your choice your plan B?</dd>

    S.r1=Object.assign(S.r1,{choice:o.id,label:o.label,s:st.s,peg:st.peg,rev:o.revS,cust:o.custS,rep:o.rep,ctrl:o.ctrl,best:opts.slice().sort((a,b)=>b.revS-a.revS)[0].id}); go('r1'); };

function vR2(){
  const c=S.calc, co=S.co, out=r2Outcomes(), r=S.r2||{};
  const fisherHost = c.B25>=0
    ? `${T('{host}')}'s real interest rate is <b>${f(c.B25)}%</b> (B25). Savers are paid for holding ${esc(co.hostCur)}${c.B25>5?', but borrowing locally is expensive in real terms':''}.`
    : `${T('{host}')}'s real interest rate is <b>${f(c.B25)}%</b> (B25): savers in ${esc(co.hostCur)} lose money each year. Türkiye in October 2022: policy rate 10.5%, inflation 85.5%, so a real rate of about −75%. People swapped out of the lira.`;
  let h=`<h1>Round 2 · Borrowing</h1>
  <div class="card"><p>${T('{company}')} needs a one-year loan to set up in ${T('{host}')}: the same as 10 sales, <b>${money(10*c.B15)}</b> ${esc(co.homeCur)} or <b>${money(10*c.B28)} ${esc(co.hostCur)}</b>.</p>
  <p>Your sales are in ${esc(co.hostCur)}, so the game measures every loan's cost in ${esc(co.hostCur)}.</p></div>
  <div class="card"><h3>Fisher check</h3><p>${fisherHost}</p><p>Home real interest rate (B26): <b>${f(c.B26)}%</b>.</p>
  <p class="small">Fisher effect: interest rate = expected inflation + a real return. Real rate = interest rate − inflation.</p></div>`;
  const predOpts=[{id:'A',label:'Borrow in {hostCur}'},{id:'B',label:'Borrow in {homeCur}'},{id:'C',label:'Borrow in {homeCur} + forward contract'},{id:'D',label:'They cost about the same'}];
  if(!r.pred){
    h+=`<h2>Step 1 · Predict</h2><p>If the <b>IFE is exactly right</b> (the ${esc(co.hostCur)} moves by ${fs(c.B24)}%), which loan costs least?</p>${optList('pred',predOpts,null)}<div class="btns"><button id="bPred">Lock my prediction</button></div>`;
  } else if(!r.choice){
    h+=`<p class="small">Your prediction: ${esc(r.pred)}.</p><h2>Step 2 · Decide</h2><p>You don't know yet which year is coming. How do you borrow?</p>${optList('ch',out.opts,null)}<div class="btns"><button id="bCh">Make my decision</button></div>`;
  } else {
    const mine=out.opts.find(o=>o.id===r.choice);
    h+=`<h2>Step 3 · What it costs (in ${esc(co.hostCur)}, % of the loan)</h2>
    <div class="card"><table><thead><tr><th>Loan</th>${out.yrs.map(y=>`<th class="r">${y[0]}<br><span class="small">${esc(co.hostCur)} ${fs(y[1])}%</span></th>`).join('')}<th>Risk</th></tr></thead><tbody>
    ${out.opts.map(o=>`<tr class="${o.id===r.choice?'mine':''}"><td>${o.id}. ${T(o.label)}${o.id===r.choice?' ← you':''}</td>${o.costs.map(x=>`<td class="r">${f(x)}%</td>`).join('')}<td>${o.risk}</td></tr>`).join('')}
    </tbody></table>
    <p>Your prediction (${esc(r.pred)}) was ${r.pred==='D'?'<span class="ok">right</span>':'<span class="bad">not right</span>'}: in the IFE year all three loans cost about the same (${out.opts.map(o=>f(o.costs[1])+'%').join(', ')}).</p></div>
    <dl class="debrief">
      <dt>What happened</dt><dd>Your loan (${mine.id}) costs ${f(Math.min.apply(null,mine.costs))}% to ${f(Math.max.apply(null,mine.costs))}%, depending on the year. Risk: <b>${mine.risk}</b>.</dd>
      <dt>Why</dt><dd>The IFE says the extra interest on a ${esc(co.hostCur)} loan is about what you lose when the ${esc(co.hostCur)} falls. So "cheap" ${esc(co.homeCur)} money is only cheap if the ${esc(co.hostCur)} doesn't fall much. A forward contract removes the risk, but the bank charges you the interest gap. In many emerging markets, forwards are expensive or not available for long periods.</dd>
      <dt>Theory</dt><dd>Fisher effect · International Fisher Effect (IFE)</dd>
      <dt>Goes in your essay</dt><dd><b>Economic Environment.</b> The brief asks you to analyse <blockquote>${BRIEF.econ}</blockquote> <b>Recommendations:</b> the top band of the marking rubric asks for a note "addressing potential risks and outlining contingency measures". Your loan choice is one contingency measure.</dd>
    </dl>
    <div class="btns"><button id="bNext">Next: your governance heat map</button></div>`;
  }
  app.innerHTML=h; wireOpts();
  const bp=document.getElementById('bPred'); if(bp) bp.onclick=()=>{ const v=radioVal('pred'); if(v===null) return; S.r2={pred:predOpts[+v].id}; go('r2'); };
  const bch=document.getElementById('bCh'); if(bch) bch.onclick=()=>{ const v=radioVal('ch'); if(v===null) return; const o=out.opts[+v];
    S.r2=Object.assign(S.r2,{choice:o.id,label:o.label,costs:o.costs,risk:o.risk}); go('r2'); };
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>go('r3data');
}

function wd(iso3,k){ const c=WGIDATA[iso3]; return (c&&c[k])?{v:c[k][0],lb:c[k][1],ub:c[k][2],v17:c[k][3],yr:c[k][4]}:null; }
function gapReal(k){
  const h=wd(S.co.host,k), o=wd(S.co.home,k);
  if(!h||!o||h.lb==null||h.ub==null||o.lb==null||o.ub==null) return null;
  if(h.ub<o.lb) return 'lower'; if(h.lb>o.ub) return 'higher'; return 'unclear';
}
function vR3data(){
  const co=S.co, w=S.wgi; w.src={host:{},home:{}};
  WGI.forEach(x=>{ const h=wd(co.host,x.k), o=wd(co.home,x.k);
    if(h){ w.host[x.k]=String(h.v); w.src.host[x.k]=1; }
    if(o){ w.home[x.k]=String(o.v); w.src.home[x.k]=1; } });
  const yrs=WGI.map(x=>wd(co.host,x.k)).filter(Boolean).map(d=>d.yr);
  if(yrs.length) w.year=String(Math.max.apply(null,yrs));
  const missing=WGI.filter(x=>!w.src.host[x.k]);
  persist();
  app.innerHTML=`
  <h1>Round 3 · Your governance heat map</h1>
  <p>The World Bank's <b>Worldwide Governance Indicators</b> score each country from <b>0 to 100</b>. Higher = better. The game already has the latest scores (data updated ${WGI_UPDATED}).</p>
  <div class="note"><b>For your essay:</b> open the <b>Check ↗</b> link for the score you use, check it matches, and note the date. You need the date for your reference.</div>
  <div class="card"><div class="grid2">
    <div class="field"><label for="wDate">Date you checked online</label><input type="date" id="wDate" value="${esc(w.date||today())}"></div>

  </div>
  ${missing.length?`<p class="warn">The game has no score for ${missing.map(x=>x.name.toLowerCase()).join(', ')} in ${esc(cname(co.host))}. Look it up and type it here.</p>
   <table><tbody>${missing.map(x=>`<tr><td>${x.name}</td><td class="r"><input class="num" type="text" inputmode="decimal" id="h${x.k}" value="${esc(w.host[x.k]||'')}"></td><td><a href="${wgiLink(x.k,co.host)}" target="_blank" rel="noopener">Look up ↗</a></td></tr>`).join('')}</tbody></table>`:''}
  <p id="wMsg" class="hint"></p></div>
  ${missing.length?'<div class="btns"><button id="bMap">Show my heat map</button></div>':''}
  <div id="mapOut"></div>`;
  const dateEl=document.getElementById('wDate'); dateEl.onchange=()=>{ w.date=dateEl.value; persist(); };
  const bm=document.getElementById('bMap');
  if(bm) bm.onclick=()=>{
    missing.forEach(x=>{ w.host[x.k]=document.getElementById('h'+x.k).value.trim(); });
    w.year=document.getElementById('wYear').value.trim(); w.date=dateEl.value;
    const bad=missing.filter(x=>{ const v=num(w.host[x.k]); return !(v>=0&&v<=100); });
    const msg=document.getElementById('wMsg');
    if(bad.length){ msg.textContent='Type a score from 0 to 100 for: '+bad.map(x=>x.name).join(', ')+'.'; return; }
    if(!w.year){ msg.textContent='Type the year of the data. You need it for your reference.'; return; }
    msg.textContent=''; persist(); showMap();
  };
  if(!missing.length || WGI.every(x=>num(w.host[x.k])>=0)) showMap();
}
function showMap(){
  const co=S.co, w=S.wgi; const out=document.getElementById('mapOut');
  const hasHome=WGI.some(x=>isFinite(num(w.home[x.k])));
  const pol=weakest('Political'), leg=weakest('Legal');
  const rec = pol&&leg ? (pol.v<=leg.v?'Political':'Legal') : null;
  const rows=WGI.map(x=>{ const hv=num(w.host[x.k]), ov=num(w.home[x.k]); const gap=isFinite(ov)?hv-ov:NaN;
    const d=wd(co.host,x.k); const gr=gapReal(x.k);
    const real = gr==='lower'?'<b class="bad">Yes, lower</b>':gr==='higher'?'<b class="ok">Yes, higher</b>':gr==='unclear'?'<span class="small">Not clear</span>':'—';
    const trend = d&&d.v17!=null ? (d.v-d.v17>=0.05?'↑ ':(d.v-d.v17<=-0.05?'↓ ':''))+fs(d.v-d.v17) : '—';
    return `<tr><td>${x.name}<div class="small">${x.dim}</div></td>
      <td class="s ${band(hv)}">${f(hv)}${d&&d.lb!=null?`<div class="small" style="font-weight:400">${f(d.lb)}–${f(d.ub)}</div>`:''}${d&&String(d.yr)!==String(w.year)?`<div class="small" style="font-weight:400">(${d.yr} data)</div>`:''}${!d?'<div class="small" style="font-weight:400">(you typed)</div>':''}</td>
      ${hasHome?`<td class="s ${band(ov)}">${isFinite(ov)?f(ov):'—'}</td><td class="r">${isFinite(gap)?fs(gap):'—'}</td><td>${real}</td>`:''}
      <td class="r">${trend}</td>
      <td><a href="${wgiLink(x.k,co.host)}" target="_blank" rel="noopener">Check ↗</a></td></tr>`; }).join('');
  out.innerHTML=`<div class="card hm"><h3>Heat map: ${esc(cname(co.host))}${hasHome?' vs '+esc(cname(co.home)):''} (${esc(w.year)} data)</h3>
   <div style="overflow-x:auto"><table><thead><tr><th>Indicator</th><th>${esc(cname(co.host))}<div class="small" style="text-transform:none">score, and range</div></th>${hasHome?`<th>${esc(cname(co.home))}</th><th class="r">Gap</th><th>Real gap?</th>`:''}<th class="r">Since 2017</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="small"><b>Range</b> = the World Bank's 90% confidence interval. Scores are estimates, so: if the host's range and the home's range <b>don't overlap</b>, the gap is real. If they overlap, don't make a big claim.
   <b>Since 2017</b>: ↓ = the host got worse. Game colours: 0–33 red, 34–66 amber, 67–100 green (the game's bands, not the World Bank's).</p></div>
   <h2>Choose your first dimension</h2>
   <p>The brief asks for <b>two of three</b>: political, legal, cultural. Today you play <b>one</b>. In Week 9 your second must be a <b>different</b> one.</p>
   <div class="card">
    <label class="opt ${S.dim==='Political'?'sel':''}"><input type="radio" name="dim" value="Political" ${S.dim==='Political'?'checked':''}><b>Political</b>${rec==='Political'?'<span class="badge">weakest</span>':''}<span class="desc">Lowest political score: ${pol?pol.name+' '+f(pol.v):'—'}</span></label>
    <label class="opt ${S.dim==='Legal'?'sel':''}"><input type="radio" name="dim" value="Legal" ${S.dim==='Legal'?'checked':''}><b>Legal</b>${rec==='Legal'?'<span class="badge">weakest</span>':''}<span class="desc">Lowest legal score: ${leg?leg.name+' '+f(leg.v):'—'}${leg&&leg.k==='RL'?' (rule of law comes back in Week 9, so today you get your next-lowest legal score)':''}</span></label>
    <label class="opt ${S.dim==='Cultural'?'sel':''}"><input type="radio" name="dim" value="Cultural" ${S.dim==='Cultural'?'checked':''}><b>Cultural</b><span class="desc">No World Bank score. You need a cultural source, e.g. The Culture Factor (Hofstede) Country Comparison tool or the GLOBE project. Remember the critique from Lecture 3.</span></label>
    <div id="cultBox" class="${S.dim==='Cultural'?'':'hide'}">
      <p><b>Which situation fits ${esc(cname(co.host))} better?</b></p>
      <label class="opt ${S.cultCard==='CU1'?'sel':''}"><input type="radio" name="cc" value="CU1" ${S.cultCard==='CU1'?'checked':''}>Gifts and relationships</label>
      <label class="opt ${S.cultCard==='CU2'?'sel':''}"><input type="radio" name="cc" value="CU2" ${S.cultCard==='CU2'?'checked':''}>Gender roles at work</label>
      <div class="field"><label for="cSrc">Your cultural source (name, year, one score or fact)</label><input type="text" id="cSrc" value="${esc(S.cultSource)}" placeholder="e.g. The Culture Factor (2026): power distance 69"></div>
    </div>
    <p id="dMsg" class="hint"></p>
   </div>
   <div class="btns"><button id="bGo">Play Round 3</button></div>`;
  wireOpts();
  app.querySelectorAll('input[name=dim]').forEach(r=>r.addEventListener('change',()=>{ document.getElementById('cultBox').classList.toggle('hide',r.value!=='Cultural'||!r.checked); }));
  document.getElementById('bGo').onclick=()=>{
    const d=radioVal('dim'); const m=document.getElementById('dMsg');
    const de=document.getElementById('wDate'); if(de) S.wgi.date=de.value;
    if(!S.wgi.date){ m.textContent='Type the date you checked the score online.'; return; }
    if(!d){ m.textContent='Choose a dimension.'; return; }
    if(d==='Cultural'){ const cc=radioVal('cc'); const src=document.getElementById('cSrc').value.trim();
      if(!cc){ m.textContent='Choose the situation that fits your host.'; return; }
      if(!src){ m.textContent='Type your cultural source. Every snapshot needs a source.'; return; }
      S.cultCard=cc; S.cultSource=src; }
    S.dim=d; S.r3=null; go('r3');
  };
}
function snapshotText(k){
  const co=S.co, ind=WGI.find(x=>x.k===k); if(!ind) return 'Cultural source: '+S.cultSource+'.';
  const hv=num(S.wgi.host[k]), ov=num(S.wgi.home[k]);
  return cname(co.host)+' scores '+f(hv)+'/100 on '+ind.name.toLowerCase()+' in '+S.wgi.year+(isFinite(ov)?', against '+f(ov)+' for '+cname(co.home):'')+' (World Bank, 2026).';
}
function evidenceNotes(k){
  const co=S.co, d=wd(co.host,k), o=wd(co.home,k), gr=gapReal(k); const n=[];
  if(gr==='lower'||gr==='higher') n.push('The gap is real: the 90% ranges do not overlap ('+cname(co.host)+' '+f(d.lb)+'–'+f(d.ub)+'; '+cname(co.home)+' '+f(o.lb)+'–'+f(o.ub)+').');
  else if(gr==='unclear') n.push('Careful: the 90% ranges overlap ('+f(d.lb)+'–'+f(d.ub)+' vs '+f(o.lb)+'–'+f(o.ub)+'), so the gap may not be real.');
  if(d&&d.v17!=null) n.push('Trend: '+f(d.v17)+' in 2017 → '+f(d.v)+' in '+d.yr+' ('+(d.v-d.v17<0?'worse':'better or the same')+').');
  return n;
}

function vR3(){
  const co=S.co, k=pickCard(), card=CARDS[k], r=S.r3||{}; const quiz=viewQuiz(card);
  const ind=WGI.find(x=>x.k===k);
  const hv=ind?num(S.wgi.host[k]):NaN, ov=ind?num(S.wgi.home[k]):NaN;
  const snap = esc(snapshotText(k)); const notes=evidenceNotes(k);
  let h=`<h1>Round 3 · ${esc(card.title)}</h1>
  <p class="small">Dimension 1: <b>${esc(S.dim)}</b>${ind?' · drawn from your weakest score: '+ind.name+' ('+f(hv)+')':''}</p>
  <div class="card event"><span class="tag">EVENT</span><p>${T(card.story)}</p><p class="real"><b>Real world:</b> ${esc(card.real)}</p></div>`;
  if(!r.choice){
    h+=`<h2>Decide</h2>${optList('ch',card.ch.map((c,i)=>({id:String.fromCharCode(65+i),t:c.t})),null)}<div class="btns"><button id="bCh">Make my decision</button></div>`;
  } else if(r.quiz==null){
    const mine=card.ch[r.idx];
    h+=`<p>You chose: <b>${esc(mine.t)}</b></p><h2>Think: ${esc(quiz.q)}</h2>${optList('qz',quiz.opts.map(o=>({id:'',label:o})).map((o,i)=>({id:String.fromCharCode(65+i),label:o.label})),null)}<div class="btns"><button id="bQz">Check</button></div>`;
  } else {
    const mine=card.ch[r.idx];
    const correctIdx = quiz.correct!=null ? quiz.correct : quiz.opts.indexOf(mine.view);
    const qOk = r.quiz===correctIdx;
    h+=`<div class="card"><p>You chose: <b>${esc(mine.t)}</b></p>
      <p>${esc(quiz.q)} You said <b>${esc(quiz.opts[r.quiz])}</b>: ${qOk?'<span class="ok">right</span>':'<span class="bad">not quite</span>'}. ${quiz.correct==null?'Your choice follows <b>'+esc(mine.view)+'</b>.':''}</p>
      <p class="small">${esc(quiz.why)}</p></div>
    <div class="card"><table><thead><tr><th>Choice</th><th class="r">Revenue</th><th class="r">Reputation</th><th class="r">Control</th></tr></thead><tbody>
      ${card.ch.map((c,i)=>`<tr class="${i===r.idx?'mine':''}"><td>${String.fromCharCode(65+i)}. ${esc(c.t)}${i===r.idx?' ← you':''}</td><td class="r">${fs(c.rev,0)} pts</td><td class="r">${fs(c.rep,0)}</td><td class="r">${fs(c.ctrl,0)}</td></tr>`).join('')}
    </tbody></table><p class="small">Every choice costs something. There is no "free" answer.</p></div>
    <dl class="debrief">
      <dt>Snapshot (your fact with a citation)</dt><dd>${snap}${notes.length?'<ul>'+notes.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':''}</dd>
      <dt>Theory</dt><dd>${esc(card.theory)}</dd>
      <dt>Risk &amp; mitigation</dt><dd>Your choice: ${esc(mine.t)} Remaining risk: ${esc(mine.risk)}</dd>
      <dt>Goes in your essay</dt><dd><b>Political, Legal &amp; Cultural Environment</b>, dimension 1 (${esc(S.dim)}). For each dimension the brief asks for:
        <blockquote>1. ${BRIEF.plc1}<br>2. ${BRIEF.plc2}<br>3. ${BRIEF.plc3}</blockquote>
        Ask yourself: what does this mean for <b>${esc(co.name)}</b> in particular? Is it about your company, or could it be about any company?</dd>
    </dl>
    <div class="btns"><button id="bNext">See my results</button></div>`;
  }
  app.innerHTML=h; wireOpts();
  const bch=document.getElementById('bCh'); if(bch) bch.onclick=()=>{ const v=radioVal('ch'); if(v===null) return; const c=card.ch[+v];
    S.r3={card:k,idx:+v,choice:c.t,rev:c.rev,rep:c.rep,ctrl:c.ctrl,view:c.view,quiz:null}; go('r3'); };
  const bq=document.getElementById('bQz'); if(bq) bq.onclick=()=>{ const v=radioVal('qz'); if(v===null) return; S.r3.quiz=+v; go('r3'); };
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>go('end');
}

/* ---------- results + log ---------- */
function totals(){
  const r1=S.r1||{}, r3=S.r3||{};
  return {rev:(r1.rev||0)+(r3.rev||0), cust:r1.cust||0, rep:(r1.rep||0)+(r3.rep||0), ctrl:(r1.ctrl||0)+(r3.ctrl||0)};
}
function profile(t){
  if(t.rep>=2&&t.rev<85) return ['Trust builder','You protected your name, and paid for it in revenue.'];
  if(t.rev>=85&&t.rep<=0) return ['Money protector','You protected revenue, but your reputation is exposed.'];
  if(t.ctrl>=2) return ['Control keeper','You kept control and limited what others can change or learn.'];
  return ['Balancer','You traded a little of everything.'];
}
function buildLog(){
  const co=S.co,c=S.calc,r1=S.r1,r2=S.r2,r3=S.r3; const card=CARDS[r3.card]; const ind=WGI.find(x=>x.k===r3.card);
  const L=[]; const line=t=>L.push(t);
  line('MARKET ENTRY DESK · DECISION LOG · MG2644 (Week 8)');
  line('Company: '+co.name+' | Home: '+cname(co.home)+' | Host: '+cname(co.host)+' | Saved: '+new Date().toLocaleString('en-GB'));
  line('Game results are simplified. Do NOT cite them. Cite the real sources below.'); line('');
  line('YOUR EXCEL NUMBERS (Seminar 3 file)');
  line('Price at home (B15): '+money(c.B15)+' '+co.homeCur+' | Rate now (B16): '+f(c.B16,4)+' '+co.hostCur+' per 1 '+co.homeCur);
  line('Inflation forecast next year: host '+f(c.B17)+'%, home '+f(c.B18)+'% | Policy rates: host '+f(c.B19,2)+'%, home '+f(c.B20,2)+'% | Worst year (B21): '+f(c.B21)+'%');
  line('PPP change (B23): '+fs(c.B23,2)+'% | IFE change (B24): '+fs(c.B24,2)+'% | Real rate host (B25): '+f(c.B25,2)+'%, home (B26): '+f(c.B26,2)+'%');
  line('Local price: today '+money(c.B28)+' | PPP '+money(c.B29)+' | IFE '+money(c.B30)+' | shock '+money(c.B31)+' ('+co.hostCur+')');
  const shown=Object.keys(S.shown).filter(k=>S.shown[k]); if(shown.length) line('Answers shown by the game (fix these in Excel): '+shown.join(', '));
  line('');
  line('ROUND 1 · CURRENCY SHOCK → Recommendations (pricing note); Economic Environment (PPP implications for pricing)');
  line('Event: '+(r1.peg?'Peg-break stress test (Egypt, March 2024 style): ':'Your worst year again: ')+fs(r1.s)+'% '+co.hostCur+' per 1 '+co.homeCur);
  line('Prediction: '+r1.pred+' (best: '+r1.best+') | Choice: '+r1.choice+'. '+r1.label);
  line('Theory: PPP, IFE');
  line('For your note: range '+money(c.B29)+'–'+money(c.B30)+' '+co.hostCur+'; stress test '+money(c.B31)+' '+co.hostCur+'; state assumptions; name a plan B.');
  line('Brief: "'+BRIEF.pricing+'"'); line('');
  line('ROUND 2 · BORROWING → Economic Environment (Fisher/IFE); Recommendations (contingency)');
  line('Choice: '+r2.choice+'. '+T(r2.label).replace(/&amp;/g,'&')+' | Prediction: '+r2.pred+' (right answer: D, about the same if IFE holds) | Risk: '+r2.risk);
  line('Host real rate (Fisher): '+f(c.B25,2)+'%. Theory: Fisher effect, IFE');
  line('Brief: "'+BRIEF.econ+'"'); line('');
  line('ROUND 3 · INSTITUTIONS → Political, Legal & Cultural Environment, dimension 1: '+S.dim);
  line('Event: '+card.title+' | Choice: '+r3.choice+' | View: '+r3.view);
  line('Theory: '+card.theory+' | Remaining risk: '+card.ch[r3.idx].risk);
  line('Snapshot: '+snapshotText(r3.card)); if(ind) evidenceNotes(ind.k).forEach(t=>line('  '+t));
  line('Real-world example on the card: '+card.real);
  line('Reminder: dimension 2 (Week 9) must be a different one of political, legal, cultural.'); line('');
  line('ALL SIX GOVERNANCE SCORES, World Bank WGI (host'+(WGI.some(x=>isFinite(num(S.wgi.home[x.k])))?' / home':'')+'), '+S.wgi.year+' data, checked online '+S.wgi.date);
  WGI.forEach(x=>{ const hv=num(S.wgi.host[x.k]), ov=num(S.wgi.home[x.k]); line(' - '+x.name+': '+f(hv)+(isFinite(ov)?' / '+f(ov):'')); });
  line('');
  line('SOURCES TO CITE (Harvard; add your own access dates)');
  line(' - World Bank (2026) World Development Indicators: PA.NUS.FCRF and FP.CPI.TOTL.ZG. Available at: https://data.worldbank.org (Accessed: [date]).');
  line(' - IMF (2026) World Economic Outlook database / DataMapper: inflation forecasts. Available at: https://www.imf.org/external/datamapper (Accessed: [date]).');
  line(' - [Central bank name] (2026) Policy interest rate. Available at: [web address] (Accessed: [date]).');
  WGI.filter(x=>!ind||x.k===ind.k).forEach(x=>line(' - World Bank (2026) Worldwide Governance Indicators: '+x.name+' - governance score (0-100). Last updated '+WGI_UPDATED+'. Available at: '+wgiLink(x.k,co.host)+' (Accessed: '+S.wgi.date+').'));
  return L.join('\n');
}
function buildCSV(){
  const co=S.co,c=S.calc,r1=S.r1,r2=S.r2,r3=S.r3; const card=CARDS[r3.card];
  const q=t=>'"'+String(t).replace(/"/g,'""')+'"';
  const rows=[['Round','Event','Your choice','Result (game, do not cite)','Theory','Essay section'],
   ['1','Currency shock '+fs(r1.s)+'%',r1.choice+'. '+r1.label,'Revenue kept '+f(r1.rev,0)+'%, customers '+f(r1.cust,0)+'%','PPP; IFE','Recommendations: pricing note'],
   ['2','One-year loan',r2.choice+'. '+T(r2.label).replace(/&amp;/g,'&'),'Cost '+r2.costs.map(x=>f(x)+'%').join(' / ')+' (PPP/IFE/shock year); risk '+r2.risk,'Fisher; IFE','Economic Environment; Recommendations'],
   ['3',card.title,r3.choice,'Revenue '+fs(r3.rev,0)+' pts, reputation '+fs(r3.rep,0)+', control '+fs(r3.ctrl,0),card.theory,'Political, Legal & Cultural: '+S.dim]];
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function download(name,text,type){ const b=new Blob([text],{type:type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function fileBase(){ return 'MED_'+(S.co.name||'game').replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)+'_'+cname(S.co.host).replace(/[^A-Za-z0-9]+/g,'_'); }

function vEnd(){
  const t=totals(), p=profile(t), co=S.co; const log=buildLog();
  app.innerHTML=`
  <h1>Your results · Week 8</h1>
  <div class="meters">
    <div class="meter"><div class="lab">Revenue kept</div><div class="val">${f(t.rev,0)}%</div><div class="small">Round 1, plus Round 3</div></div>
    <div class="meter"><div class="lab">Customers kept</div><div class="val">${f(t.cust,0)}%</div><div class="small">Round 1</div></div>

  <h2>1 · Download your decision log</h2>
  <p>It lists your numbers, your choices, the theory for each, the essay section it belongs to, and the sources to cite. Save it to OneDrive.</p>
  <div class="btns"><button id="bTxt">Download log (.txt)</button><button class="ghost" id="bCsv">Download table (.csv for Excel)</button><button class="ghost" id="bCopy">Copy log</button></div>
  <pre class="log" id="logPre">${esc(log)}</pre>

  <p>Lab computers may forget your game. Download your save file to OneDrive, <b>or</b> copy the save code into your notes.</p>

  <p class="small">After Lecture 8. Open this page again and load your save.</p></div>`;
  document.getElementById('bTxt').onclick=()=>download(fileBase()+'_log.txt',log,'text/plain;charset=utf-8');
  document.getElementById('bCsv').onclick=()=>download(fileBase()+'_log.csv',buildCSV(),'text/csv;charset=utf-8');
  document.getElementById('bCopy').onclick=()=>{ const b=document.getElementById('bCopy');
    const done=()=>{ b.textContent='Copied ✓'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(log).then(done,()=>selectLog()); } else selectLog(); };
  document.getElementById('bSave').onclick=()=>download(fileBase()+'_save.json',JSON.stringify(S),'application/json');
  document.getElementById('bCode').onclick=()=>{ const o=document.getElementById('codeOut'); o.value=saveCode(); o.classList.remove('hide'); o.select(); };
}
function selectLog(){ const r=document.createRange(); r.selectNodeContents(document.getElementById('logPre')); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }

document.getElementById('resetBtn').onclick=()=>{
  const m=document.getElementById('resetMsg');
  if(m.dataset.armed){ try{localStorage.removeItem(KEY);}catch(e){} S=fresh(); m.textContent=''; delete m.dataset.armed; render(); window.scrollTo(0,0); }
  else { m.dataset.armed='1'; m.textContent='This deletes your game on this computer. Click "Start again" once more to confirm.'; setTimeout(()=>{ delete m.dataset.armed; m.textContent=''; },6000); }
};
render();
