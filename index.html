<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Entry Desk · MG2644 coursework toolkit</title>
<style>
:root{
  --ink:#14213d; --muted:#5b6478; --line:#d9dee8; --bg:#f5f7fb; --card:#ffffff;
  --brand:#0b2545; --accent:#13657a; --accent-soft:#e3f1f4;
  --red:#b42318; --red-soft:#fde7e5; --amber:#8a5a00; --amber-soft:#fff3d6;
  --green:#1d6b3a; --green-soft:#e2f4e8; --lock:#8b93a5;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
header{background:var(--brand);color:#fff;padding:14px 20px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
header .title{font-weight:700;font-size:1.1rem;letter-spacing:.2px}
header .code{opacity:.8;font-size:.85rem}
nav.steps{max-width:1000px;margin:10px auto 0;display:flex;gap:6px;flex-wrap:wrap}
nav.steps span{font-size:.75rem;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#dfe7f5}
nav.steps span.on{background:#fff;color:var(--brand);font-weight:700}
nav.steps span.done{background:rgba(255,255,255,.28);color:#fff}
nav.steps span.locked{opacity:.55}
main{max-width:1000px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:2rem;margin:.2em 0 .3em;line-height:1.2}
h2{font-size:1.45rem;margin:1.2em 0 .5em;line-height:1.25}
h3{font-size:1.1rem;margin:1em 0 .4em}
p{margin:.5em 0}
.lead{font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.event{border-left:6px solid var(--red);background:#fff}
.event .tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.real{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.warn{background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.small{font-size:.85rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button,.btn{font:inherit;font-size:1rem;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
button.quiet{background:#eef1f6;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid #f2b705;outline-offset:2px}
label{font-weight:600}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:9px;background:#fff;width:100%}
input.num{max-width:170px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr} html{font-size:17px}}
.field{margin:10px 0}
.field .help{font-weight:400;font-size:.85rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
td.r,th.r{text-align:right}
.cell{display:inline-block;background:#eef1f6;border-radius:6px;padding:1px 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;font-weight:700}
.yellow{background:#fff6cc}.green{background:#e2f4e8}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.hint{font-size:.85rem;color:var(--red)}
.opt{display:block;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;font-weight:400;background:#fff}
.opt input{margin-right:10px;transform:scale(1.2)}
.opt b{font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .desc{display:block;margin-left:28px;font-size:.92rem;color:var(--muted)}
tr.mine{background:var(--accent-soft);font-weight:700}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.meters{grid-template-columns:1fr 1fr}}
.meter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.meter .lab{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.meter .val{font-size:1.6rem;font-weight:800}
.debrief{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:6px 18px 12px;margin:16px 0}
.debrief dt{font-weight:800;color:var(--accent);margin-top:10px;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}
.debrief dd{margin:2px 0 4px 0}
blockquote{margin:6px 0;padding:6px 12px;border-left:4px solid var(--line);color:#333;background:#fafbfd;font-size:.95rem}
.hm td.s{text-align:center;font-weight:800;border-radius:6px}
.b-red{background:var(--red-soft);color:var(--red)}.b-amb{background:var(--amber-soft);color:var(--amber)}.b-grn{background:var(--green-soft);color:var(--green)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}
.locked{color:var(--lock)}
pre.log{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.8rem;max-height:340px;overflow:auto}
footer{max-width:1000px;margin:0 auto;padding:0 18px 30px;font-size:.8rem;color:var(--muted)}
.hide{display:none}
.layout{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding:22px 18px 40px}
.layout.noside{grid-template-columns:minmax(0,1fr);max-width:1000px}
.layout.noside aside{display:none}
.layout main{max-width:none;margin:0;padding:0;min-width:0}
@media (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}}
aside#side{position:sticky;top:12px;align-self:start}
@media (max-width:1050px){aside#side{position:static}}
header .menuBtn{background:rgba(255,255,255,.15);color:#fff;font-size:.85rem;padding:6px 12px;border-radius:8px}
.emap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.emap h3{margin:0 0 2px;font-size:1.05rem}
.emap .prog{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.emap .bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:4px 0 8px}
.emap .bar i{display:block;height:100%;background:var(--green);transition:width .6s}
.emap .sec{padding:8px 0;border-top:1px solid var(--line)}
.emap .sec b{font-size:.86rem}
.emap .it{display:flex;gap:7px;align-items:flex-start;font-size:.82rem;cursor:pointer;color:var(--ink);background:none;border:0;padding:3px 0;text-align:left;font-weight:400;width:100%;border-radius:6px}
.emap .it:hover{background:var(--accent-soft)}
.emap .tick{width:18px;height:18px;border-radius:50%;border:2px solid #c3cad6;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;margin-top:1px;color:#fff}
.emap .tick.on{background:var(--green);border-color:var(--green)}
.emap button.dl{width:100%;margin-top:8px;font-size:.85rem;padding:9px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.tools{grid-template-columns:1fr}}
.tool{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;color:var(--ink);font-weight:400;display:block;width:100%}
.tool:hover,.tool:focus-visible{border-color:var(--accent)}
.tool .n{display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-right:10px;flex:none}
.tool h3{display:flex;align-items:center;margin:0 0 6px}
.tool p{margin:4px 0;font-size:.95rem}
.tool .st{font-size:.82rem;color:var(--muted)}
.tool .st.ok{color:var(--green);font-weight:700}
.lab svg{width:100%;height:auto;display:block;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;touch-action:none}
.caption{font-size:1.02rem;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0;min-height:3.2em}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
@media (max-width:700px){.ctrl{grid-template-columns:1fr}}
.ctrl label{display:block;font-size:.92rem}
.ctrl3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:700px){.ctrl3{grid-template-columns:1fr}}
.ctrl output{font-weight:800;color:var(--accent)}
input[type=range]{width:100%;accent-color:#13657a}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.stepper span{font-size:.78rem;padding:4px 10px;border-radius:999px;background:#eef1f6;color:var(--muted)}
.stepper span.on{background:var(--green);color:#fff}
.essaybox{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:10px 18px 14px;margin:16px 0}
.essaybox h3{margin-top:6px;color:var(--accent)}
.qopt{display:block;width:100%;text-align:left;margin:7px 0;background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:500}
.qopt.right{border-color:var(--green);background:var(--green-soft)}
.qopt.wrong{border-color:var(--red);background:var(--red-soft)}
.chip{display:inline-block;font-size:.8rem;background:#eef1f6;border-radius:999px;padding:3px 10px;margin:2px}
.hmt{border-collapse:separate;border-spacing:4px;width:100%}
.hmt th{border:0;padding:4px 6px}
.hmt td{border:0;padding:8px 8px}
.hmt td.c{text-align:center;font-weight:800;border-radius:8px;transition:background-color .6s,color .6s;min-width:78px}
.hmt tr.row{cursor:pointer}
.hmt tr.row:hover td.lab{color:var(--accent);text-decoration:underline}
.hmt tr.sel td.lab{color:var(--accent);font-weight:800}
.hmt td.grp{font-size:.75rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding-top:12px;font-weight:800}
.hmt.trend td.c{min-width:46px;font-size:.82rem;padding:7px 4px}
.legend{display:flex;gap:4px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:38px;height:14px;border-radius:3px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{background:#eef1f6;color:var(--ink)}
.tabs button.on{background:var(--brand);color:#fff}
textarea{font:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:9px;width:100%}
.frame .fact{background:#fafbfd;border-left:4px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:.98rem}
.banner{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;margin:10px 0}
main{overflow-wrap:break-word}
@media (max-width:700px){ #app td[id^="m"]{min-width:0 !important} #app input.num{max-width:120px} #app table td{padding:6px 4px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>

function isNum(v){ return typeof v==='number' && Number.isFinite(v); }

function num(v){
  if(v===null||v===undefined) return NaN;
  if(typeof v==='number') return v;
  let t=String(v).trim().replace(/[−–—]/g,'-').replace(/[\s£€$%¥₹₺₫]/g,'');
  t=t.replace(/^[A-Za-z]{1,3}(?=[-\d.,])/,'');
  /* Decimal comma ("3,4" or "33450,12") as well as thousands commas ("631,354"). */
  const c=t.indexOf(',')>=0, d=t.indexOf('.')>=0;
  if(c&&d){ t=(t.lastIndexOf(',')>t.lastIndexOf('.'))?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,''); }

  if(t==='') return NaN;
  return Number(t);
}

    if(c.B16>0 && Math.abs(v-c.B15/c.B16)<=Math.max(1,0.01*c.B15/c.B16)) return {ok:false,msg:'You divided. B28 multiplies: =B15*B16.'};
    return {ok:false,msg:'Not right yet.'};
  }
  const base=(isNum(c.B28)&&c.B28>0)?c.B28:e.B28;
  const pct=(v/base-1)*100;
  const want={B29:e.B23,B30:e.B24,B31:c.B21}[k];
  const tol=Math.max(0.06,100/base);
  if(Math.abs(pct-want)<=tol) return {ok:true};
  if(Math.abs(v-base*(1+want))<=Math.max(1,0.01*base*(1+want))) return {ok:false,msg:'Did you forget /100? The change is a percentage.'};
  return {ok:false,msg:'Not right yet.'};
}

/* ---------- governance data ---------- */
function wdy(iso3,k,y){ const c=WGIALL[iso3]; if(!c||!c[k]) return null; const t=c[k][y-2017]; return t?{v:t[0],lb:t[1],ub:t[2],yr:y}:null; }
function wd(iso3,k){ for(let y=2025;y>=2017;y--){ const d=wdy(iso3,k,y); if(d){ const b=wdy(iso3,k,2017); d.v17=b?b.v:null; return d; } } return null; }
function hasAny(iso3,k){ const c=WGIALL[iso3]; return !!(c&&c[k]); }
function latestYear(iso3){ let m=null; WGI.forEach(x=>{ const d=wd(iso3,x.k); if(d&&(m===null||d.yr>m)) m=d.yr; }); return m||2025; }
function heatYear(){ if(!S.heat.year) S.heat.year=latestYear(S.co.host); return S.heat.year; }
function hv(k,y,side){ const iso=side==='home'?S.co.home:S.co.host; const d=wdy(iso,k,y); if(d) return d;
  if(!hasAny(iso,k) && y===latestYear(iso)){ const t=num(S.wgi[side==='home'?'home':'host'][k]); if(isNum(t)&&t>=0&&t<=100) return {v:t,lb:null,ub:null,yr:y,typed:true}; }
  return null; }
function gapRealY(k,y){ const h=hv(k,y,'host'), o=hv(k,y,'home');
  if(!h||!o||h.lb==null||o.lb==null) return null; if(h.ub<o.lb) return 'lower'; if(h.lb>o.ub) return 'higher'; return 'unclear'; }
function weakestY(dim,y){ let best=null; WGI.filter(w=>w.dim===dim).forEach(w=>{ const d=hv(w.k,y,'host'); if(d&&(best===null||d.v<best.v)) best={k:w.k,v:d.v,name:w.name}; }); return best; }
const SHADES=['#a63603','#e6550d','#fd8d3c','#fdbe85','#feedde'];
function shade(v){ if(!isNum(v)) return '#eef1f6'; const i=Math.min(4,Math.max(0,Math.floor(v/20))); return SHADES[i]; }
function shadeText(v){ return isNum(v)&&v<40?'#ffffff':'#1f2a37'; }

/* ---------- animation ---------- */
let ANIM=0, TIMERS=[];
function stopAll(){ ANIM++; TIMERS.forEach(t=>clearInterval(t)); TIMERS=[]; const pb=document.getElementById('bPlayY'); if(pb) pb.textContent='▶ Play 2017 → 2025'; }
function tween(dur,fn,done){ const tok=ANIM; if(RM){ fn(1); if(done) done(); return; }
  const t0=performance.now(); function step(t){ if(tok!==ANIM) return; const p=Math.min(1,(t-t0)/dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; fn(e); if(p<1) requestAnimationFrame(step); else if(done) done(); }
  requestAnimationFrame(step); }
function seq(steps){ let i=0; const next=()=>{ if(i<steps.length){ const s=steps[i++]; s(next); } }; next(); }
function lerp(a,b,t){ return a+(b-a)*t; }
function $(id){ return document.getElementById(id); }

function buildChecklist(){
  const co=S.co, c=S.calc, my=S.my, h=S.heat, y=heatYear(); const L=[];
  L.push('MG2644 COURSEWORK CHECKLIST (Market Entry Desk)'); L.push('Company: '+(co.name||'')+' | Home: '+cname(co.home)+' | Host: '+cname(co.host)+' | Saved: '+new Date().toLocaleString('en-GB')); L.push('');
  emapSecs().forEach(s=>{ L.push(s.sec.toUpperCase()); s.items.forEach(it=>L.push((it[1]?'[x] ':'[ ] ')+it[0])); L.push(''); });
  L.push('YOUR NUMBERS');
  const g=(k)=>isNum(c[k])?c[k]:my[k];
  L.push('Inflation forecasts: host '+f(g('B17'))+'%, home '+f(g('B18'))+'%  ->  PPP (B23): '+fs(g('B17')-g('B18'),2)+'%');
  L.push('Policy rates: host '+f(g('B19'),2)+'%, home '+f(g('B20'),2)+'%  ->  IFE (B24): '+fs(g('B19')-g('B20'),2)+'%');
  L.push('Real interest rate (Fisher): host '+f(g('B19')-g('B17'),2)+'%, home '+f(g('B20')-g('B18'),2)+'%');
  if(allOk()) L.push('Prices ('+co.hostCur+'): today '+money(c.B28)+' | PPP '+money(c.B29)+' | IFE '+money(c.B30)+' | stress test '+money(c.B31));
  L.push('');
  ['pol','leg'].forEach(gk=>{ const k=h[gk]; if(!k) return; const w=WGI.find(x=>x.k===k); const fr=h.frames[gk]||{};
    L.push((gk==='pol'?'POLITICAL':'LEGAL')+' DIMENSION: '+w.name); L.push('Fact: '+factText(k,y));
    if(fr.imp) L.push('Implication: '+fr.imp); if(fr.theory) L.push('Theory: '+fr.theory); if(fr.risk) L.push('Risk: '+fr.risk); if(fr.mit) L.push('Mitigation: '+fr.mit); L.push(''); });
  L.push('Remember: cite the World Bank, the IMF and central banks. The toolkit only organises your evidence.');
  return L.join('\n');
}

  function play(rf,rh,nofall,after){ reset(rf,rh); const B=mode.base, hEnd=1000*(1+rh/100), fEnd=1000*B*(1+rf/100), rEnd=nofall?B:B*(1+rf/100)/(1+rh/100);

         n=>{ const fin=fEnd/rEnd, up=rf>=rh, hi=up?'host':'home', lo=up?'home':'host', gap=f(Math.abs(rf-rh),1);
              if(!nofall){ $('cap').innerHTML=Math.abs(rf-rh)<0.005?`Same interest in both places, so the exchange rate is not expected to move. Both jars end at about <b>${money(hEnd)} ${esc(mode.ol)}</b>.`:`The ${hi} jar earned more interest (<b>${f(Math.max(rf,rh),2)}%</b> against <b>${f(Math.min(rf,rh),2)}%</b>), but the host currency got ${up?'weaker':'stronger'} by about the gap (<b>${gap}%</b>). Both jars end at about <b>${money(hEnd)} ${esc(mode.ol)}</b>. The extra interest was cancelled out. That is the IFE.`; if(after) after(); return; }
              $('cap').innerHTML=`If the exchange rate did not move, the ${hi} jar would win: <b>${money(up?fin:hEnd)}</b> against <b>${money(up?hEnd:fin)}</b>. Free money…`;

    el('line',{x1:X(0),y1:30,x2:X(0),y2:190,stroke:'#0b2545','stroke-dasharray':'4 4','stroke-width':1.5},sv);
    const g1=X(0)+(X(r)-X(0))*pg; el('rect',{x:Math.min(X(0),g1),y:52,width:Math.abs(g1-X(0)),height:36,rx:5,fill:'#1d6b3a'},sv);

      if(pr>=1){ const t=el('text',{x:b-8,y:123,'text-anchor':'end','font-size':13,'font-weight':700,fill:'#ffffff'},sv,(i>=0?'Inflation eats ':'Falling prices add ')+f(Math.abs(i),1)+'%');
        let w=0; try{ w=t.getComputedTextLength(); }catch(e){}

   <p id="scen"><b>Brazil, 2020: reais per euro (yearly average).</b> Even using the inflation that really happened in 2020 (3.2% in Brazil, about 0% in Italy), PPP pointed to only about +3%. Interest rates at the start of the year (Selic 4.5%, ECB −0.5%) gave an IFE of about +5%.</p>

    const step=sc.ymax-sc.ymin>100?25:(sc.ymax-sc.ymin>40?10:5);

    el('text',{x:X0,y:Y0+28,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#0b2545'},sv,'Today');

    if(ap>0&&sc.act!=null){ const ax=lerp(X0,X1,ap), ay=lerp(Y(0),Y(sc.act),ap); el('line',{x1:X0,y1:Y(0),x2:ax,y2:ay,stroke:sc.stressLbl?'#e6550d':'#b42318','stroke-width':3,'stroke-dasharray':'6 4'},sv);

  function setGuess(v){ if(!isNum(v)) return; if(sc.ymin==null) fixMin(); guess=Math.max(sc.ymin,Math.min(sc.ymax,v)); $('sG').value=guess; $('oG').textContent=f(guess,1); if(!revealed) draw(); }

           'Explain what that score means for <b>your company</b>, using one theory (Normativism/Relativism, Dependencia, Bargaining School or Appropriability). Your heat-map paragraphs (tool 3) are your first draft.',
           'Finish with the risk and what your company would do about it.'],
    avoid:'Picking both dimensions from the same group (e.g. two legal ones), or calling a gap real when the ranges overlap.', replay:['heat','Not sure how to read it? Go back to the heat map']};
}
function vTables(){
  if(!setupDone()) return go('company');
  const co=S.co, c=S.calc, s=srcDefaults(); const specs=tableSpecs();
  const field=(id,label,val,type,ph)=>`<div class="field"><label for="${id}">${label}</label><input type="${type||'text'}" id="${id}" value="${esc(val||'')}" placeholder="${esc(ph||'')}"></div>`;
  let h=`<h1>Your essay tables</h1>
  <p class="lead">Three tables made from <b>your own Excel numbers and real data</b>, set out the way a report would. You can copy them straight into your essay.</p>
  <div class="card"><h3>Why use them?</h3>
  <p><b>1. They save words.</b> The brief says figures and tables, and their captions, do not count towards your 2,500 words.</p>
  <p><b>2. They show your evidence at a glance</b>, with the source under each table.</p>
  <p><b>3. They help you write.</b> Each table goes in one section of your essay. The notes below tell you which one and what to write.</p></div>
  <div class="warn"><b>Three rules</b><br>1. Point to every table in your text ("Table 1 shows…"). A table on its own earns few marks: <b>your explanation for your company</b> earns them.<br>2. These tables are <b>extra</b>. Your two required figures must still be charts you made in Excel (the brief: "Screenshots of two figures you created from your data").<br>3. If you played the Week 8 game, <b>never</b> use its results (revenue %, customers %, reputation, control). They came from game rules, not real data.</div>
  <h2>Step 1 · Where did your numbers come from?</h2>
  <p>Fill this in once. It completes the source line under each table and your reference list.</p>
  <div class="card"><div class="grid2">
   ${field('sInfl','Date you looked up the IMF inflation forecasts',s.inflDate,'date')}
   ${field('sFx','Date you downloaded the World Bank exchange rates (Seminar 3)',s.fxDate,'date')}
   ${field('sHostCB','Host central bank name',s.hostCB,'text','e.g. Bank of Thailand')}
   ${field('sHostUrl','Its web page for the policy rate',s.hostCBurl,'text','https://…')}
   ${field('sHostDate','Date you checked the host rate',s.hostDate,'date')}
   ${field('sWgi','Date you checked a governance score online',s.wgiDate,'date')}
   ${field('sHomeCB','Home central bank name',s.homeCB,'text','e.g. European Central Bank')}
   ${field('sHomeUrl','Its web page for the policy rate',s.homeCBurl,'text','https://…')}
   ${field('sHomeDate','Date you checked the home rate',s.homeDate,'date')}
  </div><div class="btns"><button id="bSrc">Update my tables</button></div><p id="srcMsg" class="small"></p></div>`;
  if(!allOk()) h+='<div class="banner"><b>Tables 1 and 2 need your checked Excel numbers.</b> Finish the Excel checker (tool 2) first. <button type="button" class="quiet" data-replay="calc">Go to the Excel checker</button></div>';
  specs.forEach((sp,i)=>{ if(i<2&&!allOk()) return; const n=i+1, g=tableGuide(n,co,c);
    h+=`<h2>Step ${n+1} · Table ${n}: ${esc(['Price scenarios','Inflation and interest rates','Governance scores'][i])}</h2>
    <div class="card">
      <dl class="debrief" style="border:0;padding:0;margin:0">
        <dt>In plain English</dt><dd>${g.plain}</dd>
        <dt>Where it goes in your essay</dt><dd>${g.where}</dd>
        <dt>How to use it</dt><dd><ol style="margin:4px 0 0 20px;padding:0">${g.steps.map(x=>'<li>'+x+'</li>').join('')}</ol></dd>
        <dt>Avoid</dt><dd>${g.avoid}</dd>${g.replay?`<dd><button type="button" class="quiet" data-replay="${g.replay[0]}">${g.replay[1]}</button></dd>`:''}
      </dl>
      <div style="background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:14px;overflow-x:auto">${tableHTML(n,sp)}</div>
      <div class="btns"><button data-copy="${i}" data-label="Copy for Word">Copy for Word</button><button class="ghost" data-png="${i}">Download image (.png)</button></div>
    </div>`; });
  h+=`<h2>Step 5 · Add these to your reference list</h2>
  <p>Harvard style. "a" and "b" separate two World Bank sources from the same year. Check any part in [square brackets].</p>
  <div class="card"><ol style="margin:0 0 0 20px;padding:0" id="refOl">${refList().map(r=>'<li style="margin-bottom:6px">'+esc(r).replace(/\[([^\]]+)\]/g,'<b class="bad">[$1]</b>')+'</li>').join('')}</ol>
  <div class="btns"><button id="bRefs" data-label="Copy reference list">Copy reference list</button></div></div>
  <div class="btns"><button class="quiet" id="bBackEnd" type="button">← My toolkit</button></div>`;
  app.innerHTML=h;
  document.getElementById('bSrc').onclick=()=>{ const v=id=>document.getElementById(id).value.trim();
    Object.assign(S.src,{inflDate:v('sInfl'),fxDate:v('sFx'),hostCB:v('sHostCB'),hostCBurl:v('sHostUrl'),hostDate:v('sHostDate'),wgiDate:v('sWgi'),homeCB:v('sHomeCB'),homeCBurl:v('sHomeUrl'),homeDate:v('sHomeDate')});
    persist(); vTables(); renderSide(); const m=document.getElementById('srcMsg'); if(m) m.textContent='Tables updated ✓'; document.getElementById('bSrc').scrollIntoView({block:'center'}); };
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.copy; copyRich(tableHTML(i+1,specs[i]),tablePlain(i+1,specs[i]),b); S.copied['t'+(i+1)]=true; persist(); renderSide(); });
  app.querySelectorAll('[data-png]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.png; tablePNG(i+1,specs[i],fileBase()+'_Table'+(i+1)+'.png'); S.copied['t'+(i+1)]=true; persist(); renderSide(); });
  app.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>go(b.dataset.replay));
  const br=document.getElementById('bRefs'); br.onclick=()=>{ const refs=refList(); copyRich('<ol>'+refs.map(r=>'<li style="font-family:Calibri,Arial,sans-serif;font-size:11pt">'+esc(r)+'</li>').join('')+'</ol>', refs.join('\n'), br); S.copied.refs=true; persist(); renderSide(); };
  document.getElementById('bBackEnd').onclick=()=>go('menu');
}


/* ---------- start ---------- */
document.getElementById('menuBtn').onclick=()=>go('menu');
document.getElementById('resetBtn').onclick=()=>{
  const m=document.getElementById('resetMsg');
  if(m.dataset.armed){ try{localStorage.removeItem(KEY);}catch(e){} S=fresh(); m.textContent=''; delete m.dataset.armed; render(); window.scrollTo(0,0); }
  else { m.dataset.armed='1'; m.textContent='This deletes your work on this computer. Click "Start again" once more to confirm.'; setTimeout(()=>{ delete m.dataset.armed; m.textContent=''; },6000); }
};
render();
</script>
